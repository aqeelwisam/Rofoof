<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>رفوف — مخطط الأولويات</title>
<style>
:root{--bg:#f7f6f2;--paper:#fff;--ink:#242522;--muted:#75766f;--line:#dfded8;--blue:#2783de;--blue-soft:#e8f2fc;--red:#d75d52;--red-soft:#fce9e7;--orange:#c87931;--orange-soft:#fbebde;--green:#3d9165;--green-soft:#e8f1ec;--wood:#b6855f;--wood-dark:#8b6243;--shadow:0 1px 2px rgba(35,31,26,.06),0 8px 24px rgba(35,31,26,.06)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}.app{width:min(100%,480px);min-height:100vh;margin:auto;background:linear-gradient(#fbfaf7,#f5f2eb);padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom));position:relative}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:10px;background:#2c2c2b;color:white;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}h1{font-size:22px;line-height:1.1;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:4px}.icon-btn{min-width:54px;height:44px;padding:0 10px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:10px;color:var(--ink);cursor:pointer}.summary{display:flex;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 18px}.summary strong{font-size:14px}.summary span{color:var(--muted);font-size:13px}.progress{width:84px;height:7px;border-radius:7px;background:#ecebe7;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}.shelf{margin-bottom:19px}.shelf-head{display:flex;align-items:center;gap:10px;padding:0 4px 9px}.badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:700}.shelf h2{font-size:16px;margin:0;flex:1}.count{font-size:12px;color:var(--muted);background:#ebeae6;padding:3px 8px;border-radius:20px}.now .badge{background:var(--red-soft);color:var(--red)}.later .badge{background:var(--orange-soft);color:var(--orange)}.someday .badge{background:var(--blue-soft);color:var(--blue)}.bookcase{background:rgba(255,255,255,.64);border:1px solid #e3ddd4;border-bottom:0;border-radius:12px 12px 2px 2px;min-height:84px;padding:11px 10px 8px;display:flex;gap:8px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}.bookcase::-webkit-scrollbar{display:none}.shelf-plank{height:12px;border-radius:2px 2px 6px 6px;background:linear-gradient(#c69a73,#ad7954);box-shadow:0 3px 0 var(--wood-dark),0 7px 12px rgba(89,58,35,.16)}.book{flex:0 0 52px;height:68px;border:0;border-radius:5px 5px 2px 2px;padding:7px 5px;color:#31312f;text-align:right;writing-mode:vertical-rl;overflow:hidden;font-size:12px;font-weight:650;line-height:1.25;cursor:pointer;box-shadow:inset -3px 0 rgba(255,255,255,.25),2px 2px 4px rgba(48,38,30,.12);position:relative}.book:nth-child(3n+1){height:62px}.book:nth-child(3n+2){height:73px}.now .book{background:#efb3ad}.later .book{background:#efc99f}.someday .book{background:#b9d7f3}.book.done{opacity:.48;text-decoration:line-through;filter:grayscale(.25)}.empty{width:100%;align-self:center;text-align:center;color:#aaa69e;font-size:13px;padding:12px}.hint{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 0}.fab{position:fixed;z-index:5;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 40px),440px);height:56px;border:0;border-radius:12px;background:#2c2c2b;color:white;font-weight:700;font-size:16px;box-shadow:0 10px 28px rgba(30,30,28,.23);cursor:pointer}.fab span{font-size:22px;vertical-align:-1px;margin-left:8px}.overlay{position:fixed;inset:0;background:rgba(25,25,23,.42);display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.open{display:flex}.sheet{width:min(100%,480px);background:var(--paper);border-radius:18px 18px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.12)}.grab{width:38px;height:4px;background:#d8d7d3;border-radius:5px;margin:0 auto 17px}.sheet h3{font-size:20px;margin:0 0 18px}.label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;outline:none;background:#fbfbfa;color:var(--ink)}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}.choices{display:grid;gap:8px;margin:14px 0 18px}.choice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}.choice input{accent-color:var(--blue)}.choice small{display:block;color:var(--muted);margin-top:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{height:48px;border-radius:10px;border:1px solid var(--line);background:white;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.task-sheet .actions{grid-template-columns:1fr 1fr 1fr}.task-title{font-size:18px;font-weight:750;margin:0 0 6px}.task-meta{font-size:13px;color:var(--muted);margin-bottom:18px}.toast{position:fixed;z-index:20;left:50%;bottom:92px;transform:translate(-50%,15px);background:#2c2c2b;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:24px}.app{min-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.fab{bottom:40px}.overlay{align-items:center}.sheet{border-radius:18px;padding-bottom:24px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">▤</div><div><h1>رفوف</h1><div class="subtitle">رتّب يومك كما ترتّب كتبك</div></div></div>
    <button class="icon-btn" id="resetBtn" aria-label="إعادة ضبط المهام" title="إعادة ضبط اليوم">إعادة</button>
  </header>
  <section class="summary" aria-label="ملخص اليوم"><div><strong id="dateLabel">اليوم</strong><span id="summaryText"> — ابدأ بما يهم</span></div><div><span id="doneLabel">0 من 0</span><div class="progress"><i id="progressBar"></i></div></div></section>

  <section class="shelf now" data-level="now"><div class="shelf-head"><span class="badge">١</span><h2>لازم يصير اليوم</h2><span class="count">0</span></div><div class="bookcase" id="now"></div><div class="shelf-plank"></div></section>
  <section class="shelf later" data-level="later"><div class="shelf-head"><span class="badge">٢</span><h2>مهم، بس ممكن يتأجل</h2><span class="count">0</span></div><div class="bookcase" id="later"></div><div class="shelf-plank"></div></section>
  <section class="shelf someday" data-level="someday"><div class="shelf-head"><span class="badge">٣</span><h2>لو ما صار، عادي</h2><span class="count">0</span></div><div class="bookcase" id="someday"></div><div class="shelf-plank"></div></section>
  <p class="hint">اضغط على أي كتاب لإكماله أو نقله بين الرفوف</p>
  <button class="fab" id="addBtn"><span>＋</span>أضف مهمة</button>
</main>

<div class="overlay" id="addOverlay" role="dialog" aria-modal="true" aria-labelledby="addTitle"><form class="sheet" id="addForm"><div class="grab"></div><h3 id="addTitle">مهمة جديدة</h3><label class="label" for="taskInput">شنو تريد تسوي؟</label><input class="field" id="taskInput" maxlength="60" placeholder="مثلاً: مراجعة تقرير المريض" required autofocus><div class="choices" role="radiogroup" aria-label="اختر الرف"><label class="choice"><input type="radio" name="level" value="now" checked><span><b>لازم يصير اليوم</b><small>الأكثر أهمية الآن</small></span></label><label class="choice"><input type="radio" name="level" value="later"><span><b>مهم، بس ممكن يتأجل</b><small>مهم من دون استعجال</small></span></label><label class="choice"><input type="radio" name="level" value="someday"><span><b>لو ما صار، عادي</b><small>أقل أهمية</small></span></label></div><div class="actions"><button type="button" class="btn" data-close>إلغاء</button><button type="submit" class="btn primary">أضف للرف</button></div></form></div>

<div class="overlay" id="taskOverlay" role="dialog" aria-modal="true" aria-labelledby="selectedTask"><div class="sheet task-sheet"><div class="grab"></div><p class="task-title" id="selectedTask"></p><p class="task-meta" id="selectedMeta"></p><div class="choices" id="moveChoices"></div><div class="actions"><button class="btn" id="deleteTask">حذف</button><button class="btn" id="moveTask">نقل</button><button class="btn primary" id="toggleDone">تمّت</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const labels={now:'لازم يصير اليوم',later:'مهم، بس ممكن يتأجل',someday:'لو ما صار، عادي'};
const sample=[{id:'a1',text:'أهم مهمة اليوم',level:'now',done:false},{id:'a2',text:'اتصال مهم',level:'now',done:false},{id:'b1',text:'قراءة المقال',level:'later',done:false},{id:'c1',text:'ترتيب الملفات',level:'someday',done:false}];
let tasks=JSON.parse(localStorage.getItem('shelves.tasks')||'null')||sample;let selected=null;
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('shelves.tasks',JSON.stringify(tasks))}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){['now','later','someday'].forEach(level=>{const box=$('#'+level),items=tasks.filter(t=>t.level===level);box.innerHTML=items.length?items.map(t=>`<button class="book ${t.done?'done':''}" data-id="${t.id}" aria-label="${esc(t.text)}">${esc(t.text)}</button>`).join(''):'<div class="empty">هذا الرف فارغ</div>';document.querySelector(`[data-level="${level}"] .count`).textContent=items.length});const done=tasks.filter(t=>t.done).length,total=tasks.length;$('#doneLabel').textContent=`${done} من ${total}`;$('#progressBar').style.width=(total?done/total*100:0)+'%';$('#summaryText').textContent=total?` — ${tasks.filter(t=>t.level==='now'&&!t.done).length} مهام مهمة بانتظارك`:' — أضف أول مهمة';$$('.book').forEach(b=>b.onclick=()=>openTask(b.dataset.id))}
function open(overlay){overlay.classList.add('open')}function close(overlay){overlay.classList.remove('open')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function openTask(id){selected=id;const t=tasks.find(x=>x.id===id);$('#selectedTask').textContent=t.text;$('#selectedMeta').textContent='موجودة حالياً في: '+labels[t.level];$('#toggleDone').textContent=t.done?'إرجاع':'تمّت';$('#moveChoices').innerHTML=Object.entries(labels).map(([k,v])=>`<label class="choice"><input type="radio" name="moveLevel" value="${k}" ${k===t.level?'checked':''}><span><b>${v}</b></span></label>`).join('');open($('#taskOverlay'))}
$('#addBtn').onclick=()=>{open($('#addOverlay'));setTimeout(()=>$('#taskInput').focus(),100)};
$$('[data-close]').forEach(x=>x.onclick=()=>close(x.closest('.overlay')));
$$('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)close(o)}));
$('#addForm').onsubmit=e=>{e.preventDefault();const text=$('#taskInput').value.trim(),level=new FormData(e.target).get('level');if(!text)return;tasks.push({id:Date.now().toString(36),text,level,done:false});save();render();e.target.reset();close($('#addOverlay'));toast('انضافت المهمة للرف')};
$('#toggleDone').onclick=()=>{const t=tasks.find(x=>x.id===selected);t.done=!t.done;save();render();close($('#taskOverlay'));toast(t.done?'أحسنت — تمّت المهمة':'رجعت المهمة')};
$('#moveTask').onclick=()=>{const t=tasks.find(x=>x.id===selected),level=document.querySelector('input[name="moveLevel"]:checked').value;t.level=level;save();render();close($('#taskOverlay'));toast('انتقلت المهمة إلى رف جديد')};
$('#deleteTask').onclick=()=>{tasks=tasks.filter(x=>x.id!==selected);save();render();close($('#taskOverlay'));toast('انحذفت المهمة')};
$('#resetBtn').onclick=()=>{if(confirm('ترجع كل المهام كنموذج البداية؟')){tasks=JSON.parse(JSON.stringify(sample));save();render();toast('رجعنا نموذج البداية')}};
const fmt=new Intl.DateTimeFormat('ar-IQ',{weekday:'long',day:'numeric',month:'long'});$('#dateLabel').textContent=fmt.format(new Date());render();
</script>
</body>
</html>
